<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TabocideScan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --paper: #eceee8;
    --surface: #f8f9f5;
    --ink: #17231d;
    --muted: #5b6a61;
    --line: #c9cfc4;
    --signal: #d9930d;
    --signal-ink: #3a2700;
    --ok: #1d7a4a;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121a16;
      --surface: #1b2620;
      --ink: #eaf0e8;
      --muted: #9aaba0;
      --line: #2f3d35;
      --signal: #f0b030;
      --signal-ink: #2a1c00;
      --ok: #5fd08e;
      --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
h1 span { color: var(–signal); }
.sub { color: var(–muted); font-size: .85rem; }

/* Viewfinder */
.finder {
position: relative;
background: #0b110e;
border-radius: 14px;
overflow: hidden;
aspect-ratio: 4 / 3;
border: 1px solid var(–line);
}
#reader { width: 100%; height: 100%; }
#reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
#reader img[alt=“Info icon”], #reader > div:not([id]) { display: none !important; }
.idle {
position: absolute; inset: 0; display: grid; place-items: center;
color: #cdd6cf; text-align: center; padding: 24px; font-size: .95rem; line-height: 1.4;
pointer-events: none;
}
.idle.hide { display: none; }
/* Scan line: the one memorable element */
.laser {
position: absolute; left: 8%; right: 8%; top: 50%; height: 2px;
background: var(–signal);
box-shadow: 0 0 14px 2px var(–signal);
pointer-events: none; display: none;
}
.finder.live .laser { display: block; animation: sweep 2.2s ease-in-out infinite alternate; }
@keyframes sweep { from { top: 32%; } to { top: 68%; } }
@media (prefers-reduced-motion: reduce) { .finder.live .laser { animation: none; } }
.finder.hit { outline: 3px solid var(–ok); outline-offset: -3px; }

/* Buttons */
.row { display: flex; gap: 10px; flex-wrap: wrap; }
button {
font: inherit; font-weight: 700; cursor: pointer;
border-radius: 10px; border: 1px solid var(–line);
background: var(–surface); color: var(–ink);
padding: 13px 16px; min-height: 48px;
}
button:focus-visible, input:focus-visible { outline: 3px solid var(–signal); outline-offset: 2px; }
button.primary { background: var(–signal); border-color: var(–signal); color: var(–signal-ink); flex: 1 1 160px; }
button.grow { flex: 1 1 120px; }
button:disabled { opacity: .5; cursor: not-allowed; }

/* Result */
.result {
background: var(–surface); border: 1px solid var(–line);
border-radius: 14px; padding: 16px; display: grid; gap: 10px;
}
.label { font-size: .8rem; color: var(–muted); }
.code {
font-family: ui-monospace, “SF Mono”, Menlo, Consolas, monospace;
font-size: 1.45rem; font-weight: 700; word-break: break-all; min-height: 2.2rem;
user-select: all;
}
.code.empty { color: var(–muted); font-weight: 400; font-size: 1rem; }
.status { font-size: .9rem; min-height: 1.3em; }
.status.ok { color: var(–ok); }
.status.err { color: var(–err); }

/* Settings + history */
.opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: .92rem; }
.opts label { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(–signal); }

h2 { margin: 6px 0 0; font-size: 1rem; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li {
display: flex; align-items: center; justify-content: space-between; gap: 10px;
background: var(–surface); border: 1px solid var(–line); border-radius: 10px;
padding: 8px 8px 8px 12px;
}
li .t { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .95rem; word-break: break-all; }
li .w { color: var(–muted); font-size: .75rem; display: block; }
li button { min-height: 40px; padding: 8px 12px; font-size: .85rem; }
.none { color: var(–muted); font-size: .9rem; }
#file { display: none; }
#filereader { display: none; }
</style>

</head>
<body>
<main>
  <header>
    <h1>Tabocide<span>Scan</span></h1>
    <span class="sub">Hasil scan otomatis tersalin</span>
  </header>

  <section class="finder" id="finder" aria-label="Kamera pemindai">
    <div id="reader"></div>
    <div class="idle" id="idle">Tekan “Mulai scan”, lalu arahkan kamera ke barcode sampai garis menutupi seluruh batang.</div>
    <div class="laser"></div>
  </section>

  <div class="row">
    <button class="primary" id="toggle">Mulai scan</button>
    <button class="grow" id="torch" disabled>Senter</button>
    <button class="grow" id="pick">Dari foto</button>
    <input type="file" id="file" accept="image/*">
  </div>
  <div id="filereader"></div>

  <section class="result" aria-live="polite">
    <span class="label">Hasil scan terakhir</span>
    <div class="code empty" id="code">Belum ada hasil</div>
    <div class="status" id="status"></div>
    <div class="row">
      <button class="primary" id="copy" disabled>Salin lagi</button>
      <button class="grow" id="clear" disabled>Hapus</button>
    </div>
  </section>

  <div class="opts">
    <label><input type="checkbox" id="autocopy" checked> Salin otomatis</label>
    <label><input type="checkbox" id="continuous"> Scan terus-menerus</label>
    <label><input type="checkbox" id="beep" checked> Bunyi &amp; getar</label>
  </div>

  <section>
    <h2>Riwayat</h2>
    <ul id="history"><li class="none" style="border:none;background:none;padding:0">Belum ada.</li></ul>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = {
    finder: $('finder'), idle: $('idle'), toggle: $('toggle'), torch: $('torch'),
    pick: $('pick'), file: $('file'), code: $('code'), status: $('status'),
    copy: $('copy'), clear: $('clear'), autocopy: $('autocopy'),
    continuous: $('continuous'), beep: $('beep'), history: $('history')
  };

  let scanner = null;
  let running = false;
  let torchOn = false;
  let last = { text: '', at: 0 };
  let hist = [];

  const FORMATS = () => {
    const F = Html5QrcodeSupportedFormats;
    return [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.QR_CODE];
  };

  function setStatus(msg, type = '') {
    el.status.textContent = msg;
    el.status.className = 'status ' + type;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }
  }

  function feedback() {
    if (!el.beep.checked) return;
    try { navigator.vibrate && navigator.vibrate(60); } catch (_) {}
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 1800;
      g.gain.value = 0.08;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.09);
      o.onended = () => ctx.close();
    } catch (_) {}
  }

  function renderHistory() {
    el.history.innerHTML = '';
    if (!hist.length) {
      const li = document.createElement('li');
      li.className = 'none';
      li.style.cssText = 'border:none;background:none;padding:0';
      li.textContent = 'Belum ada.';
      el.history.appendChild(li);
      return;
    }
    hist.forEach(h => {
      const li = document.createElement('li');
      const left = document.createElement('div');
      const t = document.createElement('span');
      t.className = 't'; t.textContent = h.text;
      const w = document.createElement('span');
      w.className = 'w'; w.textContent = h.time;
      left.append(t, w);
      const b = document.createElement('button');
      b.textContent = 'Salin';
      b.addEventListener('click', async () => {
        const ok = await copyText(h.text);
        setStatus(ok ? 'Tersalin: ' + h.text : 'Gagal menyalin. Tekan lama teks untuk menyalin manual.', ok ? 'ok' : 'err');
      });
      li.append(left, b);
      el.history.appendChild(li);
    });
  }

  async function onResult(text, format) {
    const now = Date.now();
    if (text === last.text && now - last.at < 2500) return; // cegah hasil dobel
    last = { text, at: now };

    el.code.textContent = text;
    el.code.classList.remove('empty');
    el.copy.disabled = false;
    el.clear.disabled = false;
    el.finder.classList.add('hit');
    setTimeout(() => el.finder.classList.remove('hit'), 700);
    feedback();

    const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    hist.unshift({ text, time });
    hist = hist.slice(0, 15);
    renderHistory();

    if (el.autocopy.checked) {
      const ok = await copyText(text);
      setStatus(ok ? 'Tersalin otomatis, siap di-paste.' : 'Browser menolak salin otomatis. Tekan “Salin lagi”.', ok ? 'ok' : 'err');
    } else {
      setStatus('Terbaca (' + (format || 'barcode') + ').', 'ok');
    }

    if (!el.continuous.checked) stop();
  }

  async function start() {
    if (running) return;
    if (typeof Html5Qrcode === 'undefined') {
      setStatus('Pustaka scanner gagal dimuat. Cek koneksi internet lalu muat ulang.', 'err');
      return;
    }
    try {
      scanner = new Html5Qrcode('reader', {
        formatsToSupport: FORMATS(),
        useBarCodeDetectorIfSupported: true,
        verbose: false
      });
      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 15,
          qrbox: (w, h) => ({ width: Math.floor(w * 0.9), height: Math.floor(Math.min(h * 0.55, w * 0.45)) }),
          disableFlip: false,
          videoConstraints: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            advanced: [{ focusMode: 'continuous' }]
          }
        },
        (text, res) => onResult(text, res && res.result && res.result.format && res.result.format.formatName),
        () => {}
      );
      running = true;
      el.finder.classList.add('live');
      el.idle.classList.add('hide');
      el.toggle.textContent = 'Berhenti';
      setStatus('Kamera aktif. Arahkan ke barcode.');
      checkTorch();
    } catch (err) {
      running = false;
      const msg = String(err);
      if (/Permission|NotAllowed/i.test(msg)) setStatus('Izin kamera ditolak. Izinkan kamera di pengaturan browser.', 'err');
      else if (/NotFound|Requested device/i.test(msg)) setStatus('Kamera tidak ditemukan.', 'err');
      else setStatus('Kamera gagal dibuka. Pastikan halaman dibuka lewat HTTPS. (' + msg + ')', 'err');
    }
  }

  async function stop() {
    if (!scanner) return;
    try { if (running) await scanner.stop(); scanner.clear(); } catch (_) {}
    running = false; torchOn = false;
    el.finder.classList.remove('live');
    el.idle.classList.remove('hide');
    el.toggle.textContent = 'Mulai scan';
    el.torch.disabled = true;
    el.torch.textContent = 'Senter';
  }

  function checkTorch() {
    try {
      const caps = scanner.getRunningTrackCameraCapabilities();
      el.torch.disabled = !(caps && caps.torchFeature && caps.torchFeature().isSupported());
    } catch (_) { el.torch.disabled = true; }
  }

  el.toggle.addEventListener('click', () => running ? stop() : start());

  el.torch.addEventListener('click', async () => {
    try {
      await scanner.getRunningTrackCameraCapabilities().torchFeature().apply(!torchOn);
      torchOn = !torchOn;
      el.torch.textContent = torchOn ? 'Senter mati' : 'Senter';
    } catch (_) { setStatus('Senter tidak didukung di perangkat ini.', 'err'); }
  });

  el.pick.addEventListener('click', () => el.file.click());
  el.file.addEventListener('change', async () => {
    const f = el.file.files && el.file.files[0];
    if (!f) return;
    if (running) await stop();
    try {
      const s = new Html5Qrcode('filereader', { formatsToSupport: FORMATS(), useBarCodeDetectorIfSupported: true, verbose: false });
      const res = await s.scanFileV2(f, false);
      s.clear();
      await onResult(res.decodedText, res.result && res.result.format && res.result.format.formatName);
    } catch (_) {
      setStatus('Barcode tidak terbaca dari foto. Coba foto yang lebih dekat, tajam, dan lurus.', 'err');
    }
    el.file.value = '';
  });

  el.copy.addEventListener('click', async () => {
    const t = el.code.textContent;
    const ok = await copyText(t);
    setStatus(ok ? 'Tersalin: ' + t : 'Gagal menyalin. Tekan lama teks hasil untuk menyalin manual.', ok ? 'ok' : 'err');
  });

  el.clear.addEventListener('click', () => {
    el.code.textContent = 'Belum ada hasil';
    el.code.classList.add('empty');
    el.copy.disabled = true; el.clear.disabled = true;
    last = { text: '', at: 0 };
    setStatus('');
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden && running) stop(); });
})();
</script>

</body>
</html>
